<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATRIX CHAT</title>

<style>
body {
  background: black;
  color: #0f0;
  font-family: monospace;
  padding: 20px;
}

.messages-box {
  height: 400px;
  overflow-y: auto;
  border: 1px solid #0f0;
  padding: 10px;
  margin-bottom: 10px;
}

.message-row {
  margin-bottom: 10px;
}

input {
  background: black;
  color: #0f0;
  border: 1px solid #0f0;
  padding: 5px;
}

button {
  background: black;
  color: #0f0;
  border: 1px solid #0f0;
  padding: 5px 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<h2>MATRIX CHAT</h2>
<div>Status: <span id="connStatus">CONNECTING...</span></div>
<div>Online: <span id="onlineCount">0</span></div>

<div id="messagesBox" class="messages-box"></div>

<input id="nickInput" placeholder="Nickname">
<input id="msgInput" placeholder="Message">
<button id="sendBtn">Send</button>

<!-- ✅ FIXED SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(async function(){

const SUPABASE_URL = "YOUR_URL";
const SUPABASE_KEY = "YOUR_ANON_KEY";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const deviceId = "dev_" + Math.random().toString(36).slice(2,8);

// DOM
const box = document.getElementById("messagesBox");
const nickInput = document.getElementById("nickInput");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const status = document.getElementById("connStatus");
const online = document.getElementById("onlineCount");

// Escape
function safe(str){
  return (str || "").replace(/[&<>]/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;"
  }[m]));
}

// Render message
function render(msg){
  const div = document.createElement("div");
  div.className = "message-row";

  div.innerHTML = `
    <b>${safe(msg.nickname)}</b>
    <small>${new Date(msg.created_at).toLocaleTimeString()}</small>
    <div>${safe(msg.message)}</div>
  `;

  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// Load messages
async function load(){
  const { data, error } = await db
    .from("chat_messages")
    .select("*")
    .order("created_at",{ascending:true})
    .limit(100);

  if(error){
    console.error(error);
    status.innerText = "ERROR";
    return;
  }

  box.innerHTML = "";
  data.forEach(render);

  status.innerText = "LIVE";
}

// Send message
async function send(){
  const nick = nickInput.value.trim() || "ANON";
  const text = msgInput.value.trim();

  if(!text) return;

  const { error } = await db.from("chat_messages").insert([{
    nickname: nick,
    message: text,
    user_id: deviceId
  }]);

  if(error){
    alert(error.message);
    return;
  }

  msgInput.value = "";
}

// REALTIME
db.channel("room")
.on(
  "postgres_changes",
  { event: "INSERT", schema: "public", table: "chat_messages" },
  payload => render(payload.new)
)
.subscribe();

// Online users
setInterval(async ()=>{
  const since = new Date(Date.now()-30000).toISOString();

  const { data } = await db
    .from("chat_messages")
    .select("user_id")
    .gte("created_at", since);

  if(!data) return;

  const users = new Set(data.map(x=>x.user_id));
  users.add(deviceId);

  online.innerText = users.size;
}, 3000);

// Events
sendBtn.onclick = send;
msgInput.addEventListener("keydown", e=>{
  if(e.key === "Enter") send();
});

// Init
load();

})();
</script>

</body>
</html>
