<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
(function(){

const SUPABASE_URL = "YOUR_URL";
const SUPABASE_KEY = "YOUR_ANON_KEY";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let messages = [];
const deviceId = "dev_" + Math.random().toString(36).slice(2,8);

// DOM
const messagesBox = document.getElementById("messagesBox");
const nickInput = document.getElementById("nickInput");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const connStatus = document.getElementById("connStatus");
const onlineCount = document.getElementById("onlineCount");

// Escape
function escapeHtml(str){
  return str.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
}

// Render
function render(msg){
  const div = document.createElement("div");
  div.className = "message-row";

  div.innerHTML = `
    <div class="msg-header">
      <span class="msg-nick">> ${escapeHtml(msg.nickname)}</span>
      <span class="msg-time">${new Date(msg.created_at).toLocaleTimeString()}</span>
    </div>
    <div class="msg-content">${escapeHtml(msg.message)}</div>
  `;

  messagesBox.appendChild(div);
  messagesBox.scrollTop = messagesBox.scrollHeight;
}

// Load old messages
async function loadMessages(){
  const { data } = await supabase
    .from("chat_messages")
    .select("*")
    .order("created_at",{ascending:true})
    .limit(100);

  messagesBox.innerHTML = "";
  data.forEach(render);

  connStatus.innerText = "LIVE";
}

// Send
async function sendMessage(){
  let nick = nickInput.value.trim() || "ANON";
  let text = msgInput.value.trim();
  if(!text) return;

  await supabase.from("chat_messages").insert([{
    nickname: nick,
    message: text,
    user_id: deviceId
  }]);

  msgInput.value = "";
}

// REALTIME (THIS IS THE BIG UPGRADE)
supabase
.channel("chat-room")
.on(
  "postgres_changes",
  { event: "INSERT", schema: "public", table: "chat_messages" },
  payload => {
    render(payload.new);
  }
)
.subscribe();

// Simple online count
setInterval(async ()=>{
  const since = new Date(Date.now()-30000).toISOString();

  const { data } = await supabase
    .from("chat_messages")
    .select("user_id")
    .gte("created_at", since);

  const users = new Set(data.map(x=>x.user_id));
  users.add(deviceId);

  onlineCount.innerText = users.size;
}, 3000);

// Events
sendBtn.onclick = sendMessage;
msgInput.onkeydown = e=>{
  if(e.key==="Enter") sendMessage();
};

// Init
loadMessages();

})();
</script>
